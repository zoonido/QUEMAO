name: build quemao
 
on:
  push:
  workflow_dispatch:
 
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine checks
        run: |
          g++ -std=c++17 -O2 -Isource tests/engine_tests.cpp -o engine_tests
          ./engine_tests
 
  build-mac:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build (Audio Unit + VST3)
        run: cmake --build build --target quemao_AU quemao_VST3 --config Release
      - name: Sign and check
        run: |
          cd build/quemao_artefacts/Release
          codesign --force --deep --sign - AU/quemao.component
          codesign --force --deep --sign - VST3/quemao.vst3
          lipo -archs AU/quemao.component/Contents/MacOS/quemao
          lipo -archs VST3/quemao.vst3/Contents/MacOS/quemao
      - name: Package
        run: |
          mkdir -p package
          cp -R build/quemao_artefacts/Release/AU/quemao.component package/
          cp -R build/quemao_artefacts/Release/VST3/quemao.vst3 package/
          cd package
          ditto -c -k --sequesterRsrc . "$GITHUB_WORKSPACE/quemao-mac.zip"
      # archive: false uploads our zip as-is, so the download is ONE zip with both plugins inside
      - uses: actions/upload-artifact@v7
        with:
          path: quemao-mac.zip
          archive: false
 
